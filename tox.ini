[tox]
envlist =
    py
    flake8
isolated_build = True

[testenv]
extras = dev
# Use this line when debugging, otherwise would get this issue:
# PYDEV DEBUGGER WARNING:
; sys.settrace() should not be used when the debugger is being used.
; This may cause the debugger to stop working correctly.
; commands = python -m pytest --no-cov test  # coverage should be run due `addpts`
commands = python -m pytest {posargs:.}

[testenv:flake8]
skip_install = True
deps = flake8
commands = flake8 {posargs:.}

# flake8 doesn't support configuration in `pyproject.toml`
[flake8]
max-line-length = 127

per-file-ignores =
    # Column-aligned assignments for save/restore readability.
    src/torsocks.py:E221
    # Column-aligned keyword arguments for readability.
    src/exitmap.py:E221,E251
    src/relayselector.py:E221,E251,E704
    # Test files use sys.path.insert() before imports (necessary until
    # exitmap is restructured as an installable package).
    test/test_exitmap.py:E402
    test/test_relayselector.py:E402
    test/test_stats.py:E402
    test/test_torsocks.py:E402
    test/test_util.py:E402
    test/test_dnshealth.py:E402
    test/test_dnsresolution.py:E402

extend-ignore =
    # W503/W504 contradict each other (line break before vs after binary
    # operator). PEP 8 recommends before (W503 style), so we ignore both
    # to avoid false positives regardless of which style is used.
    W503,
    W504

exclude =
    .git,
    __pycache__,
    .tox,
    venv,
    .venv,
    build,
    dist,
    data,
    test/data
